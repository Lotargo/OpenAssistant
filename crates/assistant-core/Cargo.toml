[package]
name = "assistant-core"
version = "0.2.0"
edition = "2024"
description = "Codex and Realtime session core for OpenAssistant"
publish = false

[dependencies]
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
