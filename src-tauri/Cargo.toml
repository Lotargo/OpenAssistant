[package]
name = "open-assistant"
version = "0.1.0"
description = "A lightweight desktop assistant overlay"
authors = ["Lotargo"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "open_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "=0.18.2"
nnnoiseless = { version = "0.5.2", default-features = false }
assistant-core = { path = "../crates/assistant-core" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }


# Local WASAPI SILENT packet fix; upstream version/API remain 0.18.2.
[patch.crates-io]
cpal = { path = "../vendor/cpal" }
