<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>OpenAssistant</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/notification.css" />
    <link rel="stylesheet" href="./styles/code-ide.css" />
    <link rel="stylesheet" href="./styles/color-picker.css" />
    <link rel="stylesheet" href="./styles/agent.css" />
    <link rel="stylesheet" href="./styles/settings.css" />
  </head>
  <body>
    <main id="overlay" class="overlay" data-mode="text" aria-label="Ответ ассистента">
      <div id="drag-region" class="drag-region" data-window-drag="handle" aria-hidden="true"></div>
      <section id="text-panel" class="text-panel scroll-panel" data-scroll-panel="text" data-window-drag="background" aria-label="Текст ответа" tabindex="0">
        <div id="text-content" class="markdown-content"></div>
      </section>
      <section id="split-view" class="split-view" data-window-drag="background" aria-label="Код и пояснения">
        <div class="code-card">
          <div class="code-header">
            <svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 13l-2 2 2 2m6-4 2 2-2 2"/></svg>
            <span id="code-filename">untitled.txt</span>
          </div>
          <div id="code-panel" class="code-panel scroll-panel" data-scroll-panel="code" aria-label="Исходный код" tabindex="0">
            <div id="code-content"></div>
          </div>
        </div>
        <section id="notes-panel" class="notes-panel scroll-panel" data-scroll-panel="notes" data-window-drag="background" aria-label="Пояснения к коду" tabindex="0">
          <div id="notes-content" class="markdown-content"></div>
        </section>
      </section>
      <nav id="toolbar" class="toolbar" data-window-drag="background" aria-label="Управление ассистентом">
        <svg class="toolbar-audio toolbar-audio--left" data-toolbar-audio="left" data-window-drag-ignore data-active="false" data-clipped="false" viewBox="0 0 480 64" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path class="toolbar-audio-baseline" d="M0 32H480"/>
          <path class="toolbar-audio-wave" d="M0 32H480"/>
          <line class="toolbar-audio-level" x1="240" y1="32" x2="240" y2="32"/>
        </svg>
        <div class="toolbar-controls" data-window-drag="background">
          <div class="toolbar-session" data-window-drag="background">
            <button id="mode-btn" class="mode-button" data-action="mode" data-current-scenario="assistant" type="button" aria-label="Режим: Ассистент. Переключить: Совещание"><span class="mode-current-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 18l-4 3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7Z"/><path d="M7 8h10M7 12h7"/></svg></span><span class="mode-cycle-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 7h14m-4-4 4 4-4 4M19 17H5m4-4-4 4 4 4"/></svg></span></button>
            <button id="broadcast-btn" class="broadcast-button" data-action="broadcast" type="button" aria-label="Включить эфир" aria-pressed="false" data-stage="idle"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="2"/><path d="M7.1 7.1a7 7 0 0 0 0 9.8m9.8-9.8a7 7 0 0 1 0 9.8M4.3 4.3a11 11 0 0 0 0 15.4M19.7 4.3a11 11 0 0 1 0 15.4"/></svg></button>
          </div>
          <div class="toolbar-actions" data-window-drag="background">
            <button class="icon-button" data-action="screen" type="button" aria-label="Передавать экран модели" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
            <button class="icon-button" data-action="microphone" type="button" aria-label="Выключить микрофон" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18M9 9v2a3 3 0 0 0 5.1 2.1M9.2 5a3 3 0 0 1 5.8 1v4M6 10v2a6 6 0 0 0 10.2 4.3M18 10v2c0 .5-.1 1-.2 1.5M12 18v3M9 21h6"/></svg></button>
            <button class="icon-button" data-action="reconnect" type="button" aria-label="Переподключить модель"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg></button>
            <button class="icon-button" data-action="settings" type="button" aria-label="Открыть настройки" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 3h4l.5 2.2 1.7 1 2.1-.6 2 3.4-1.6 1.6v2.8l1.6 1.6-2 3.4-2.1-.6-1.7 1L14 21h-4l-.5-2.2-1.7-1-2.1.6-2-3.4 1.6-1.6v-2.8L3.7 9l2-3.4 2.1.6 1.7-1Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button class="icon-button" data-action="scroll-lock" type="button" aria-label="Заблокировать прокрутку" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0"/></svg></button>
            <button id="window-mode-btn" class="icon-button" data-action="window-mode" type="button" aria-label="Защищённый оверлей. Переключить в обычное окно" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-9 2-3 1v2.5c0 1.5 1.2 2.8 3 3.5 1.8-.7 3-2 3-3.5V12Z"/></svg></button>
            <button id="notifications-btn" class="icon-button" data-action="notifications" type="button" aria-label="Выключить всплывающие уведомления" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
          </div>
        </div>
        <svg class="toolbar-audio toolbar-audio--right" data-toolbar-audio="right" data-window-drag-ignore data-active="false" data-clipped="false" viewBox="0 0 480 64" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path class="toolbar-audio-baseline" d="M0 32H480"/>
          <path class="toolbar-audio-wave" d="M0 32H480"/>
          <line class="toolbar-audio-level" x1="240" y1="32" x2="240" y2="32"/>
        </svg>
      </nav>
      <div id="toolbar-tooltip" class="toolbar-tooltip" data-window-drag-ignore role="tooltip" hidden></div>
    </main>
    <div id="settings-root"></div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
